# NOTE: this file is a reference copy, not the deployment source of truth.
# The actual deployed stack lives at /home/pi/git/pi-desktop/docker/docker-compose.yml
# on pi-desktop (combined with other services, project name "docker"). Keep this file
# in sync with that one manually until the live Pi cutover to deployments/docker-compose.yml
# happens (out of scope for the apps/libs/data/deployments restructure itself).
#
# This is an include-only fragment, not standalone-runnable: `depends_on: home-monitoring-db`
# below refers to the service declared in deployments/mariadb/docker-compose.yml, not
# this file, so `docker compose -f deployments/hive-app/docker-compose.yml config`
# reports it as undefined on its own. Validate via the combined
# deployments/docker-compose.yml, which include:s all three per-service files together.
services:
  hive-app:
    container_name: hive-app
    image: mholubinka1/hive-app:latest
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # The image runs as non-root UID 999 (deployments/hive-app/Dockerfile), and this
    # directory now needs to be *writable* by that UID, not just readable --
    # hive_auth_state.json (see ADR-0019) is created/rewritten here on every
    # login/refresh, not just read like config.yml. Provision the host
    # path (chown to UID 999, or an equivalent ACL) before first deploy, or
    # the first successful login can never be persisted. The log directory
    # needs the same treatment: the app writes a rotating hive-monitor.log
    # there, and silently falls back to console-only logging if /log is not
    # writable by UID 999.
    volumes:
      - /mnt/media/pi-media/containers/hive-app/config:/config
      - /mnt/media/pi-media/containers/hive-app/log:/log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 192.168.0.50
      - 1.1.1.1
    restart: unless-stopped
    depends_on:
      home-monitoring-db:
        condition: service_healthy
