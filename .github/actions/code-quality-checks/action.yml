name: Code quality checks
description: >-
  Shared lint, type-check, and static analysis steps used by both the
  self-hosted push workflow and the hosted fork-PR fallback workflow.

inputs:
  github-token:
    description: Token passed through to gitleaks for its API calls.
    required: true

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        python-version: '3.13'
        # Pin the uv binary (not just the action) so `uv audit` — which uv still
        # marks experimental — runs the same version CI-side as the pinned
        # uv-audit pre-commit hook (astral-sh/uv-pre-commit 0.11.33).
        version: '0.11.33'

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    - name: Install markdownlint-cli and markdown-link-check
      shell: bash
      run: npm install -g markdownlint-cli markdown-link-check

    - name: Verify uv.lock is consistent with pyproject.toml
      shell: bash
      run: uv lock --check

    - name: Install project dependencies
      shell: bash
      # --all-packages: this is a uv workspace (apps/octopus-app, apps/hive-app,
      # libs/common) whose root has no [project.dependencies] of its own. A plain
      # `uv sync` only installs the root project's (empty) closure, leaving every
      # workspace member's own runtime deps (pydantic, sqlalchemy, pyhive-integration,
      # ...) uninstalled -- which breaks mypy (can't resolve imports) and pytest
      # (can't import the apps under test) further down this file.
      run: uv sync --locked --all-packages

    - name: Validate pyproject.toml
      shell: bash
      run: >-
        uv run --with 'validate-pyproject[all]' validate-pyproject
        pyproject.toml
        apps/octopus-app/pyproject.toml
        apps/hive-app/pyproject.toml
        libs/common/pyproject.toml

    - name: Audit dependencies for known vulnerabilities
      shell: bash
      run: uv audit

    - name: Type check with mypy
      shell: bash
      run: uv run mypy apps/octopus-app/octopus_app apps/hive-app/hive_app libs/common/common

    - name: Check import ordering with isort
      shell: bash
      run: uv run isort --check-only --profile black apps/ libs/

    - name: Check code formatting with black
      shell: bash
      run: uv run black --check apps/ libs/

    - name: Check linting with ruff
      shell: bash
      run: uv run ruff check --no-fix apps/ libs/

    - name: Check linting with pylint
      shell: bash
      run: uv run pylint apps libs

    - name: Check YAML style with yamllint
      shell: bash
      run: uv run --with yamllint yamllint .

    - name: Lint GitHub Actions workflows with actionlint
      uses: docker://rhysd/actionlint:1.7.12
      with:
        args: -color

    - name: Lint shell scripts with shellcheck
      shell: bash
      run: git ls-files -z '*.sh' | xargs -0 -r uv run --with shellcheck-py shellcheck

    - name: Check spelling with codespell
      shell: bash
      run: uv run --with codespell codespell --skip=uv.lock

    - name: Check markdown style
      shell: bash
      run: markdownlint '**/*.md' --ignore node_modules

    - name: Check markdown links
      shell: bash
      # markdown-link-check only retries HTTP 429, and its `timeout` is per request, so a
      # dropped or refused connection (reported as "Status: 0") is never retried. Retry
      # the whole check instead; a link that is genuinely dead fails every attempt and
      # still fails the build.
      run: |
        for attempt in 1 2 3; do
          if find . -name "*.md" -not -path "./.git/*" -not -path "./node_modules/*" \
            -print0 | xargs -0 -r markdown-link-check --config .markdown-link-check.json; then
            exit 0
          fi
          echo "::warning::Markdown link check failed (attempt ${attempt} of 3)"
          if [ "$attempt" -lt 3 ]; then
            sleep 15
          fi
        done
        echo "::error::Markdown link check failed on all 3 attempts; a link is persistently dead."
        exit 1

    - name: Security analysis with bandit
      shell: bash
      # Scoped to non-test application code only, same as always: bandit's own
      # assert-used/hardcoded-password checks are expected noise in test code
      # (mirrors .pre-commit-config.yaml's bandit hook, which has
      # `exclude: (^|/)tests/`). There's no [tool.bandit] table in pyproject.toml
      # to carry that exclusion, and this is a raw `uv run bandit` invocation (not
      # going through pre-commit here), so it's expressed as bandit's own --exclude
      # flag instead, naming all three packages' test dirs explicitly.
      run: >-
        uv run --with 'bandit[toml]' bandit -r -c pyproject.toml apps libs
        --exclude apps/octopus-app/tests,apps/hive-app/tests,libs/common/tests

    # gitleaks-action downloads to a fixed /tmp/gitleaks.tmp and unpacks to
    # /tmp/gitleaks-<version>/; on the persistent self-hosted runner a leftover
    # from an interrupted run makes every later run fail with
    # "Destination file path /tmp/gitleaks.tmp already exists". Clear both first.
    - name: Clear stale gitleaks download cache
      shell: bash
      run: rm -rf /tmp/gitleaks.tmp /tmp/gitleaks-*

    - name: Scan for secrets with gitleaks
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
