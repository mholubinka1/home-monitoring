name: Docker Build/Publish Image - ARM64

on:
  push:
    branches:
      - '**'

jobs:
  ARM64_App_Image_Build_and_Push:
    runs-on: [ARM64]
    permissions:
      contents: write
    env:
      DOCKER_REGISTRY: docker.io
      DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/octopus-app
      HIVE_APP_DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/hive-app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        if: success()
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'

      - name: Install dependencies
        if: success()
        # --all-packages: workspace root has no [project.dependencies] of its own,
        # so a plain `uv sync` wouldn't install apps/octopus-app's, apps/hive-app's,
        # or libs/common's own runtime deps -- pytest needs all three importable to
        # run the combined test suite.
        run: uv sync --locked --all-packages

      - name: Run tests
        if: success()
        shell: bash
        run: |
          BASELINE=$(cat .github/coverage-baseline.txt)
          # No explicit --cov=<path>: bare --cov reads [tool.coverage.run]'s source
          # list from pyproject.toml, which already names all three packages
          # (apps/octopus-app/octopus_app, apps/hive-app/hive_app,
          # libs/common/common) -- verified locally, this produces the same
          # combined coverage report as enumerating three --cov= flags would.
          uv run pytest --cov --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under="$BASELINE"

      - name: Raise coverage baseline
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          BASELINE=$(cat .github/coverage-baseline.txt)
          ACTUAL=$(uv run python -c "import json; print(int(json.load(open('coverage.json'))['totals']['percent_covered']))")
          if [ "$ACTUAL" -gt "$BASELINE" ]; then
            echo "$ACTUAL" > .github/coverage-baseline.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/coverage-baseline.txt
            git commit -m "Raise coverage baseline to ${ACTUAL}% [skip ci]"
            git push
          else
            echo "Coverage unchanged at ${ACTUAL}%, baseline stays at ${BASELINE}%."
          fi

      - name: Prepare
        if: success()
        id: prepare
        run: |
          echo "docker_image=${DOCKER_REGISTRY}/${DOCKER_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "hive_app_docker_image=${DOCKER_REGISTRY}/${HIVE_APP_DOCKER_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Docker info
        run: |
          docker version
          docker info
          docker ps

      - name: Get Docker Image Tag
        if: success()
        id: tag
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH_NAME" != 'main' ]; then image_tag='dev'; else image_tag='latest'; fi
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Docker Login, Build, and Push
        if: success() && github.event_name == 'push'
        uses: nick-fields/retry@v4
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.docker_image }}:${{ steps.tag.outputs.tag }}
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 5
          shell: bash
          command: |
            set -euo pipefail
            trap 'docker logout "$DOCKER_REGISTRY" || true' EXIT
            echo "$DOCKERHUB_TOKEN" | docker login "$DOCKER_REGISTRY" --username "$DOCKERHUB_USERNAME" --password-stdin
            # Build from the local checkout rather than a remote git#{sha} context (the
            # previous docker/build-push-action default) — the remote-fetch path was the
            # confirmed root cause of a transient CI failure investigated in a sibling repo's
            # CI hardening pass. Keep the build context (the trailing `.`) at the repo root
            # so this Dockerfile's COPY paths can still reach apps/octopus-app/ and
            # libs/common/; only the -f path changed for the #530 Dockerfile relocation.
            docker buildx build --push --tag "$TAG" -f deployments/octopus-app/Dockerfile .

      - name: Docker Login, Build, and Push (hive-app)
        if: success() && github.event_name == 'push'
        uses: nick-fields/retry@v4
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.hive_app_docker_image }}:${{ steps.tag.outputs.tag }}
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 5
          shell: bash
          command: |
            set -euo pipefail
            trap 'docker logout "$DOCKER_REGISTRY" || true' EXIT
            echo "$DOCKERHUB_TOKEN" | docker login "$DOCKER_REGISTRY" --username "$DOCKERHUB_USERNAME" --password-stdin
            # Same local-checkout-context rationale as the app image build above
            # (avoids the remote git#{sha} context that caused a transient CI
            # failure in a sibling repo); build context stays the repo root for the
            # same libs/common/-reachability reason. Only the -f path changed for
            # the #530 Dockerfile relocation.
            docker buildx build --push --tag "$TAG" -f deployments/hive-app/Dockerfile .
