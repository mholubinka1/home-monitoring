[project]
name = "home-monitoring"
version = "0.1.0"
description = ""
authors = [{name = "Matt Holubinka", email = "meholubinka@gmail.com"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/octopus-app", "apps/hive-app", "libs/common"]

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "black>=26.3.1",
    "mypy>=2.3.1",
    "ruff>=0.16.3",
    "pre-commit>=4.6.2",
    "ipykernel>=7.2.0",
    "types-requests>=2.33.0.20260408",
    "types-pyyaml>=6.0.12.20260815",
    "sqlalchemy-stubs>=0.4",
    "pytest>=8.3.4",
    "responses>=0.25.3",
    "pytest-cov>=7.1.0",
    "pylint>=4.0.6",
]

[tool.pytest.ini_options]
pythonpath = ["apps/octopus-app", "apps/hive-app", "libs/common"]
testpaths = ["apps/octopus-app/tests", "apps/hive-app/tests", "libs/common/tests", "scripts/tests"]
# Independent test packages (apps/octopus-app/tests, apps/hive-app/tests,
# libs/common/tests) all share the basename "tests" -- the default "prepend"
# import mode binds each to the same top-level sys.modules["tests"] entry, so
# the second and third collected collide with the first. importlib mode keys
# each test module by its fully qualified file path instead, so same-named
# packages in different directories don't clash.
#
# That alone isn't enough when a "tests" dir's own parent is a pythonpath
# entry: pytest then qualifies it under that entry's own root name, which
# collides with any other "tests" dir resolved the same way. apps/octopus-app
# and apps/hive-app both contain a hyphen, so pytest can't qualify their
# "tests" package under a namespace-package dotted name at all (e.g.
# "apps.octopus-app.tests" isn't a valid module path) and falls back to the
# shallow name "tests" -- and once libs/common was added to pythonpath (for
# the plain `common` import convention, not the fully-qualified
# `libs.common.common` form the old comment here used to explain), its own
# tests dir hit the identical collision. Only apps/octopus-app/tests keeps
# its __init__.py (as committed in #528); apps/hive-app/tests and
# libs/common/tests have none: without an __init__.py chain to walk, pytest
# treats each of their modules as rootless and assigns it a unique name
# derived from its full file path instead.
addopts = ["--import-mode=importlib"]

[tool.isort]
# Since each app became a real installable uv workspace package (#530/#531),
# isort's own installed-vs-local heuristic started treating octopus_app/
# hive_app/common as indistinguishable from genuine third-party libraries,
# merging them into one flat alphabetized import block -- which pylint's
# import-order checker (a stricter local-file-under-source-roots check that
# never changed) disagrees with, since it still expects them grouped as
# first-party after real third-party imports. Declaring them explicitly
# resolves the disagreement instead of the two tools fighting over ordering.
known_first_party = ["octopus_app", "hive_app", "common"]

[tool.coverage.run]
source = ["apps/octopus-app/octopus_app", "apps/hive-app/hive_app", "libs/common/common"]

[tool.ruff.lint]
# BLE001 (blind except Exception) is disabled repo-wide: every hit is a caller-supplied
# callable or a top-level entrypoint/reconnect boundary where no narrower exception type
# exists to catch, so the rule adds noise rather than catching real bugs here.
# I001 (import sorting) is disabled: isort --profile black already owns import order in
# CI, and it disagrees with ruff's isort implementation on a couple of groupings, so
# running both fights over the same job.
ignore = ["BLE001", "I001"]

[tool.pylint.main]
ignore-paths = ["apps/octopus-app/octopus_app/_deprecated"]
source-roots = ["apps/octopus-app", "apps/hive-app", "."]
# apps/hive-app/tests has no __init__.py (see the pytest addopts comment above for
# why), but pylint's default directory handling expects a target directory to be a
# regular package and refuses to lint it, treating the missing __init__.py as a
# parse error, unless told to walk it recursively instead of requiring that file.
recursive = true

[tool.pylint.design]
# MonitoringClient (apps/octopus-app/octopus_app/data/base.py) is a deliberate facade: it wires the Octopus API
# client, MariaDB client, and one private client per external data source (Kraken
# billing period, Agile Predict, x2r.uk) together, so its attribute count grows by one
# each time a new external source is added -- a structural property of the facade, not
# an accidental god-object. Raised from the default (7) to fit its current shape.
max-attributes = 8
# Same facade shape as max-attributes above: each fetch/persist/read method delegates
# one MonitoringClient operation to the underlying Octopus/MariaDB client it wraps, so
# the method count grows by one each time a Retriever needs a new operation. Raised
# from the default (20) to fit its current shape, then to 24 for #511's three new gas
# weather-regression read methods (read_daily_consumption_summary,
# read_weather_observation_daily_max_temps, read_weather_forecast_max_temps), then to
# 25 for read_product_rates_for_local_day (ADR-0023's gap-day rate pricing).
max-public-methods = 25

[tool.pylint."messages control"]
# Each disable below is a deliberate fit to this codebase's established conventions,
# not a blanket suppression. Re-enable individually if the underlying convention changes.
disable = [
    # This codebase has no docstrings anywhere by design — self-documenting code,
    # comments reserved for non-obvious WHY (.agent-docs/agent.md, "Production Code Quality").
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # Small data/config/model classes (Pydantic settings, SQLAlchemy models, dataclass-style
    # value objects) are intentionally simple and don't need >=2 public methods.
    "too-few-public-methods",
    # The retry()/API-wrapper architecture (octopus_app/common/decorator.py,
    # octopus_app/data/octopus/api.py, octopus_app/data/mysql/client.py) deliberately
    # catches/raises bare Exception as its error boundary.
    "broad-exception-caught",
    "broad-exception-raised",
    # f-string logging is this codebase's consistent existing convention; the lazy-%
    # performance case pylint optimizes for doesn't apply at this app's log volume.
    "logging-fstring-interpolation",
    # TODOs are tracked via GitHub issues, not blocked by lint.
    "fixme",
    # Enum members and SQLAlchemy ORM classes intentionally use lowercase names
    # (e.g. Energy.electricity, model.consumption) matching table names — an
    # established, deliberate deviation from PEP8 UPPER_CASE/PascalCase defaults.
    "invalid-name",
    # False-positive on match/case blocks whose default arm raises rather than falls
    # through; mypy already verifies the declared return type is honored on every path.
    "inconsistent-return-statements",
    # Line length is already owned by black/ruff (both configured to 88 chars);
    # pylint's own line-too-long would just re-flag under different, conflicting rules.
    "line-too-long",
    # Noisy on test files, where explicit repetition of setup/assertions aids
    # readability (BDD principle) more than a shared helper would.
    "duplicate-code",
    # apps/hive-app/tests and libs/common/tests deliberately have no __init__.py
    # (see the pytest addopts comment above), so pylint sees a test file's
    # `from .conftest import X` as leaving a package that, by its own static
    # analysis, was never entered — even though pytest's importlib import mode
    # resolves it correctly at runtime, which is what actually matters here.
    "relative-beyond-top-level",
]
