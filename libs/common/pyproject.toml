[project]
name = "monitoring-common"
version = "0.1.0"
description = ""
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.52",
    "pymysql>=1.1.2",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Installed as `monitoring-common` but imported as `common`: a bare `common` distribution
# clashes with an unrelated PyPI package, which made Dependabot try to update it and fail.
# hatchling would otherwise look for a `monitoring_common` folder.
[tool.hatch.build.targets.wheel]
packages = ["common"]
